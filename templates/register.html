{% extends "base.html" %}

{% block title %}Voter Registration | SecureVote{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 40px auto 60px auto;">
  <div class="card">
    <div style="margin-bottom: 20px;">
      <h2>Register as a Voter</h2>
      <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 4px;">
        Create your authenticated voter credential. An HMAC secret key will be provisioned automatically.
      </p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label class="form-label" for="full_name">Full Legal Name</label>
        <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Jordan Hayes" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Choose a unique username" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password (Minimum 6 characters)</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Choose a strong password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
        Complete Registration &rarr;
      </button>
    </form>

    <div style="margin-top: 20px; font-size: 0.88rem; color: var(--text-muted); text-align: center;">
      Already registered? <a href="{{ url_for('login') }}">Sign in here</a>.
    </div>
  </div>
</div>
{% endblock %}
